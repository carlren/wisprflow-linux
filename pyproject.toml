[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "wisprflow-linux"
version = "0.2.0"
description = "WisprFlow-like push-to-talk speech-to-text for Ubuntu via OpenRouter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "requests>=2.28",
  "numpy>=1.24",
  "sounddevice>=0.4.6",
  "soundfile>=0.12",
  "pynput>=1.7",
]

[project.scripts]
wisprflow = "wisprflow.cli:main"

[tool.setuptools.packages.find]
include = ["wisprflow"]
